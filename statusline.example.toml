# claude-statusline configuration
#
# Copy to ~/.config/claude-statusline/config.toml and edit. Every key is
# optional — anything you omit falls back to the built-in default. Run
# `statusline.py dump-config` to see the fully resolved values, `validate`
# to check a file, `preview` to see it at several widths, and `segments`
# for the catalog of segments and their options.

# Which preset supplies the lines when this file declares none of its own:
# "classic" (two lines, the default), "minimal" (one line) or "dashboard"
# (three lines, bars on the left). A [[line]] below replaces the preset's
# lines entirely; [segment.*] tables merge over the preset's.
preset = "classic"

# --- lines -------------------------------------------------------------------
# Each [[line]] has a `left` group that flows from the left edge and a
# `right` group pushed against the right edge; `gap` is the minimum number
# of columns between them (default 2). When a line is too narrow, every
# segment on it steps down a detail level together (reset clock, then pace,
# then narrower bars, then no bars) before the lowest-priority segment is
# dropped. These two lines are the classic preset, written out.

[[line]]
left = ["model", "dir", "git", "pr", "cache", "cost", "env", "session", "output_style"]
right = ["heartbeat"]
gap = 1

[[line]]
left = ["context"]
right = ["limit_5h", "limit_7d", "limit_7d_model"]

# --- segments ----------------------------------------------------------------
# [segment.<name>] tunes a segment placed above. Every segment accepts
# `format` (a template: {field}, [optional group], <colour>...</colour>,
# <link>...</link>) and `priority` (higher survives longer when the line is
# too narrow); the rest are listed by `statusline.py segments`. A table may
# also name an instance of a segment with `type`, e.g.
#
#   [segment.greeting]
#   type = "text"
#   text = "hello"
#   format = "<gold>{text}</gold>"

[segment.model]
fast = true                  # show ⚡ when fast mode is on

[segment.dir]
depth = 3                    # trailing path components to keep

[segment.git]
links = true                 # OSC-8 hyperlink on the branch
last_commit = true           # read the last commit time when the tree is dirty
nudge_min = 45               # minutes before ⏱ appears on a dirty tree

[segment.cache]
min_ratio = 0.90             # warn below this prompt-cache hit ratio

[segment.context]
tokens = true                # token count beside the percentage
size = true                  # ...and the window size, e.g. (380k/1.0M)

[segment.limit_5h]
pace = true                  # ⇢ projected usage at reset
pace_min_elapsed = 0.10      # don't extrapolate from under 10% of a window
clock = true                 # wall-clock time of the reset

[segment.limit_7d]
pace = true
clock = true

[segment.heartbeat]
period = 1.0                 # seconds per frame; match refreshInterval
color = "dim"                # any key from [colors]

# --- style -------------------------------------------------------------------

[layout]
# Columns the host TUI reserves at the right edge before it truncates.
# Claude Code's fullscreen TUI eats ~4 beyond the COLUMNS it reports, so the
# default is 4 reserved + 1 wrap gap. To calibrate precisely, see the
# "Calibrating right_margin" section of the README.
right_margin = 5

separator = " │ "

# Used when the host does not export COLUMNS.
fallback_columns = 200

# Glyphs your font renders double-width even though Unicode calls them narrow.
# Symptom: the right-anchored bars get clipped by exactly the number of these
# on screen. Check yours with `ruler`.
wide_glyphs = []

[bar]
# The host sends whole-number percentages, so there are 101 possible inputs.
# At 8 sub-steps per cell, 13 cells (104 steps) is the narrowest bar that
# renders every one of them distinctly; 12 collides on 1/2, 25/26, 50/51 and
# 75/76, and anything above 13 spends columns without adding information.
width = 13

# The glyph set. `statusline.py bars` draws every style side by side.
#   "block"  █ on █   eighth-cell resolution (the default)
#   "shade"  █ on ░   shaded boundary cell
#   "thin"   ━ on ─   half-cell resolution
#   "dots"   ● on ○   half-cell resolution
#   "pips"   ▰ on ▱   whole cells
#   "ascii"  # on -   in [brackets], for fonts without block glyphs
# A bar segment can pick its own: [segment.context] style = "thin".
style = "block"

# Override the style's glyphs; "" means "from the style". Every glyph must be
# one cell wide. The track: "█" solid, "░" textured, " " blank.
full = ""
empty = ""
cap_left = ""       # glyphs framing the bar, e.g. "▕" and "▏" or "[" and "]"
cap_right = ""

# How the filled cells are coloured:
#   "level"     one colour for the whole fill, by [thresholds] (the default)
#   "gradient"  each cell by its own position, so a full bar walks
#               green → yellow → orange → red
#   a [colors] key, e.g. "cyan", for a fixed colour
#   a comma-separated list of keys, e.g. "cyan,purple", spread along the bar
fill = "level"
track = "dim"       # [colors] key for the empty cells and the caps

partial = true      # give the boundary cell sub-cell resolution
min_sliver = true   # any usage above 0 shows at least a sliver
pulse = false       # past the red threshold, embolden the fill on odd seconds

# How the boundary cell between filled and empty is drawn:
#   "auto"    match the family to the track (recommended). A solid or blank
#             track gets eighth-blocks; a textured ░ track gets shades.
#   "eighth"  ▏▎▍ — 8 steps per cell. Inks only the left fraction, so the
#             remainder is painted in the track colour when the track is
#             solid. Against a textured ░ track that is impossible and the
#             cell reads as a notch, which is why "auto" avoids the pairing.
#   "shade"   ░▒▓ — 3 steps per cell. Varies density and inks the whole cell,
#             so it stays continuous on a textured track.
#   "off"     no partial cell; the bar rounds to whole cells.
partial_style = "auto"

[thresholds]
yellow = 50
orange = 75
red = 90

[git]
enabled = true
timeout = 2.0
cache_ttl = 2.0        # seconds a cached git read stays fresh
slow_threshold = 0.35  # a read slower than this triggers backoff
slow_backoff = 10.0    # ttl = max(cache_ttl, duration * slow_backoff)

[glyphs]
model = "◆"
dir = "▸"
git = "⎇"
reset = "↻"
stash = "⚑"
ahead = "↑"
behind = "↓"
pace = "⇢"
clock = "⏱"
pr = "⇄"
host = "⌂"
env = "⬢"
fast = "⚡"
cache = "⌗"

# One character per frame, cycled in order by the heartbeat segment. Must be
# single-width glyphs. [segment.heartbeat] frames = "<name>" picks a bundled
# set instead: dots, orbit, quadrants, arc, wave, pulse, bounce, line.
heartbeat_frames = "⠋⠙⠹⠸⠼⠴⠦⠧"

[colors]
# Raw SGR parameters. 256-color ("38;5;N") or truecolor ("38;2;R;G;B").
# Templates refer to these by name: <model>...</model>, <dim>...</dim>.
reset = "0"
dim = "38;5;240"
gray = "38;5;245"
model = "38;5;141"
dir = "38;5;39"
cyan = "38;5;80"
green = "38;5;114"
yellow = "38;5;221"
orange = "38;5;208"
red = "38;5;203"
gold = "38;5;179"
purple = "38;5;176"
bold = "1"
