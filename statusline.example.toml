# claude-statusline — an annotated config.
#
# Copy to ~/.config/claude-statusline/config.toml and trim: every key is
# optional and anything you leave out keeps its default. Easier still:
#
#   statusline.py configure        change everything with a live preview
#   statusline.py set theme nord   change one thing from the shell
#   statusline.py themes           see every theme (also: styles, icons, bars)

# --- the look ------------------------------------------------------------------
theme = "claude"         # claude, claude-light, midnight, catppuccin, catppuccin-latte, tokyo-night,
                         # nord, dracula, gruvbox, rose-pine, kanagawa, everforest, one-dark,
                         # solarized-dark, solarized-light, synthwave, mono, terminal, classic
style = "auto"           # minimal, classic, dots, chips, capsules, pills, powerline, slant
                         # (auto: capsules where the terminal has Nerd Font symbols, else chips)
icons = "auto"           # nerd, unicode, emoji, none
color = "auto"           # truecolor, 256, 16, none (auto reads COLORTERM; NO_COLOR turns it off)

# --- the lines -------------------------------------------------------------------
# A preset supplies the lines until you declare your own: classic (two lines,
# the default), compact and minimal (one), focus (one, quiet), dashboard (three).
preset = "classic"

# Declaring lines replaces the preset's. `left` flows from the left edge,
# `right` is pushed against the right edge, `gap` is the least space between.
# When a line is too narrow, every segment on it gives up detail together
# (reset clock, then pace, then half bars, then no bars) before the
# lowest-priority segment is dropped. These two are the classic preset.

[[line]]
left = ["model", "dir", "git", "pr", "worktree", "cache", "cost", "env", "session", "agent", "output_style"]
gap = 1

[[line]]
left = ["context"]
right = ["limit_5h", "limit_7d", "limit_7d_model", "limit_spend"]

# --- segments --------------------------------------------------------------------
# [segment.<name>] tunes a placed segment. Every segment takes `format` (its
# template), `priority`, `icon` ("" hides it) and `color` (a theme role for
# its icon and chip); `statusline.py segments <name>` lists the rest.

[segment.model]
fast = true              # the fast-mode mark
full_name = false        # keep "(1M context)" in the name

[segment.dir]
mode = "fish"            # fish ~/P/project · compact …/a/project · full · base · project
depth = 1                # components kept whole

[segment.git]
links = true             # the branch links to the repository
nudge_min = 45           # minutes without a commit before a dirty tree shows its age

[segment.context]
label = "ctx"
tokens = true            # 279k beside the percentage
size = true              # ...as 279k/1.0M

[segment.limit_5h]
pace = true              # → where usage will be at the reset, at the current pace
pace_mode = "recent"     # recent: the last stretch's rate · average: the whole window's
reset = true             # ↻ time until the reset
clock = true             # ...and the time of day it happens

# The heartbeat, a tick that moves on every refresh, is a debugging aid and is
# off unless you place "heartbeat" on a line:
# [segment.heartbeat]
# frames = "dots"        # dots, orbit, quadrants, arc, wave, pulse, bounce, line, moon, grow, star

# A segment can be placed twice under different names with `type`:
#
# [segment.label]
# type = "text"
# text = "prod"
# color = "red"

# --- bars -------------------------------------------------------------------------
[bar]
style = "smooth"         # smooth, shade, line, slim, dots, pips, braille, ascii
width = 13               # 13 cells show every whole percentage distinctly
fill = "level"           # level (by threshold), gradient, tone, a role, or "cyan,purple" blended
track = "subtle"         # the empty part
pulse = false            # flash when past the red threshold
min_sliver = true        # anything above 0% shows a sliver

[thresholds]             # where bars and percentages turn yellow, orange and red
yellow = 50
orange = 75
red = 90

# --- Claude Quest -----------------------------------------------------------------
# An RPG that plays itself while you work. `statusline.py quest enable` turns
# it on (and registers its hooks); this switch then shows or hides it.
[quest]
enabled = false
placement = "line"       # line: its own line · inline: the hero on line 1 · manual
                         # game: the whole bar becomes the game (see below)
avatar = "auto"          # the animated pet (and game scene) in kitty: auto, on, off
avatar_cols = 8
event_seconds = 30.0     # how long loot and level-ups stay on the bar
game_rows = 3            # game mode: rows of scene under the quest ticker
game_hud = ["context", "limit_5h", "limit_7d"]   # a gauge beside each row
game_hud_width = "auto"  # columns kept for the gauges (wider on wide terminals); 0 for none
game_details = "auto"    # session details on the ticker's row: "auto" is the model, then the
                         # segments of your lines less what the gauges show; or a list, [] for none

# --- the finer points ---------------------------------------------------------------
[layout]
right_margin = 5         # columns Claude Code keeps at the right edge (statusline.py ruler)
gap = 2
fallback_columns = 200   # when COLUMNS is not set
wide_glyphs = []         # glyphs your font draws two cells wide, e.g. ["⏱"]
separator = ""           # for the classic and dots styles

[git]
enabled = true
cache_ttl = 2.0          # seconds between background refreshes

[colors]                 # override any theme role: accent, text, subtext, muted, subtle,
                         # surface, blue, cyan, teal, green, yellow, orange, red, pink, purple, gold
# accent = "#ff8800"

[glyphs]                 # override the small marks: ahead, behind, stash, pace, reset, fast, age
# ahead = "⇡"
