# dev — one line for the session, its meters and what Claude is doing, then git panels: changes, history, branches, stashes.
#
# The one line holds live activity too, so it needs no line of its own. The
# panels sit under it: the files you have changed with their line
# counts, the commit graph, the branches with how far each is ahead or behind
# its upstream, and the stashes with any rebase or merge in progress. They
# read git in the background, so the bar never waits. Your theme, style and
# icons stay yours; any key you set yourself wins over these.

[[line]]
left = ["model", "dir", "git", "pr", "turn", "tools"]
right = ["usage", "limits"]

# Click to cycle (ctrl+shift+click in kitty, after `statusline.py clicks enable`).
[segment.usage]
type = "cycle"
of = ["context", "tokens", "cost"]

[segment.limits]
type = "cycle"
of = ["limit_5h", "limit_7d"]

[panels]
show = ["files", "graph", ["branches", "ci", "servers", "stash"]]
rows = 6

[quest]
placement = "line"
