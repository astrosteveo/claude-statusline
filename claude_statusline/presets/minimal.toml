# minimal — one line, the essentials.
#
# Model, directory, git, then the context bar and the five-hour window.
# Token counts and reset clocks are off so it stays short.

[[line]]
left = ["model", "dir", "git", "context", "limit_5h"]
right = ["heartbeat"]
gap = 1

[segment.context]
tokens = false

[segment.limit_5h]
clock = false
